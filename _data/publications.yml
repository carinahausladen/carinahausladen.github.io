- title: Identifying Latent Intentions via Inverse Reinforcement Learning in Repeated Linear Public Good Games
  authors: C. I. Hausladen, M. H. Schubert, C. Engel
  venue: arXiv preprint
  venue_short: arXiv 2026
  year: 2026
  image: /images/irl.png
  url: https://arxiv.org/abs/2601.08803
  arxiv: https://arxiv.org/abs/2601.08803
  abstract: >
    We apply inverse reinforcement learning to repeated linear public-good games to recover the
    latent intentions — the reward functions — that best explain players' contribution behavior,
    offering a data-driven way to characterize the heterogeneous motivations behind cooperation.

- title: Social Perception of Faces in a Vision-Language Model
  authors: C. I. Hausladen, M. Knott, C. F. Camerer, P. Perona
  venue: ACM Conference on Fairness, Accountability, and Transparency (FAccT)
  venue_short: FAccT 2025
  year: 2025
  image: /images/CLIP1.png
  url: https://arxiv.org/abs/2408.14435
  arxiv: https://arxiv.org/abs/2408.14435
  code: # add repo URL
  slides: # add slides URL
  citations: 18
  abstract: >
    We probe social perception of human faces in CLIP, a widely used vision-language model, by
    comparing embedding similarity between validated social-psychology prompts and synthetic faces
    varied along age, gender, race, expression, lighting, and pose. CLIP makes fine-grained,
    human-like social judgments — but age, gender, and race systematically bias them, most
    strikingly for the faces of Black women. Controlling unprotected visual attributes proves
    essential: studies that omit them may reach the wrong conclusions about bias.

- title: "LLM Voting: Human Choices and AI Collective Decision Making"
  authors: J. C. Yang, M. Korecki, D. Dailisan, C. I. Hausladen, D. Helbing
  venue: AAAI/ACM Conference on AI, Ethics, and Society (AIES)
  venue_short: AIES 2024
  year: 2024
  image: /images/LLM_voting/overview.png
  url: https://arxiv.org/abs/2402.01766
  arxiv: https://arxiv.org/abs/2402.01766
  citations: 130
  abstract: >
    We compare the voting behavior of GPT-4 and LLaMA-2 against a human baseline drawn from a
    voting experiment. Input format and choice presentation shift LLM votes; varying persona
    reduces some biases and improves alignment, while a temperature-driven trade-off pits
    preference diversity against alignment accuracy. LLMs can narrow collective outcomes,
    underscoring the need for caution when integrating them into democratic processes.

- title: Perceived Warmth and Competence Predict Callback Rates in Meta-Analyzed North American Labor Market Experiments
  authors: C. I. Hausladen*, M. Gallo*, M. Hsu, A. C. Jenkins, V. Ona, C. F. Camerer
  venue: PLoS ONE
  venue_short: PLoS ONE
  year: 2024
  image: /images/warmth.png
  url: # add PLoS ONE article URL
  note: "* equal contribution"
  citations: 7
  abstract: >
    Integrating correspondence-study evidence with the Stereotype Content Model, we ask whether
    hiring discrimination can be predicted from warmth and competence perceptions. Across 21
    published studies and 592 social signals, social perception predicts callback disparities for
    race and gender, but not consistently for signals like sexuality or disability — offering a
    framework to identify likely bias without running new correspondence studies.

