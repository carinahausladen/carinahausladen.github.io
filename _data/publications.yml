- title: Text Classification of Ideological Direction in Judicial Opinions
  authors: C. I. Hausladen, M. H. Schubert, E. Ash
  venue: International Review of Law and Economics
  venue_short: Int. Rev. Law & Econ.
  year: 2020
  image: /images/judicial.png
  url: # add article DOI/URL
  citations: 65
  abstract: >
    Using the text of U.S. Circuit Court opinions, we train supervised classifiers to predict the
    ideological direction (liberal vs. conservative) of judicial decisions, comparing text
    representations and models to recover a signal of ideology directly from legal language.
