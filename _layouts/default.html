<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body class="{% if page.wide %}wide{% endif %}">

  {% include header.html %}

  <main class="content" aria-label="Content">
    <div class="wrap">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <script>
    (function () {
      var root = document.documentElement;

      /* theme toggle */
      var btn = document.getElementById('themeBtn');
      if (btn) {
        btn.addEventListener('click', function () {
          var cur = root.getAttribute('data-theme');
          if (!cur) {
            cur = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var next = cur === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
        });
      }

      /* abstract toggles */
      var buttons = document.querySelectorAll('.pill--abstract');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].addEventListener('click', function () {
          var body = this.closest('.pub__body');
          if (!body) return;
          var ab = body.querySelector('.pub__abstract');
          if (!ab) return;
          if (ab.hasAttribute('hidden')) {
            ab.removeAttribute('hidden');
            this.classList.add('is-active');
          } else {
            ab.setAttribute('hidden', '');
            this.classList.remove('is-active');
          }
        });
      }
    })();
  </script>
</body>

</html>
